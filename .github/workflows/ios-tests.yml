name: iOS Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'cursor/**' ]

jobs:
  test:
    name: Run XCTests (Phase A)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show schemes
        run: xcodebuild -list -project IdentityDesk.xcodeproj

      - name: Run tests
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone 15/{print $2; exit}')
          if [ -z "$DEST" ]; then
            xcodebuild test               -project IdentityDesk.xcodeproj               -scheme IdentityDesk               -destination 'generic/platform=iOS Simulator'               -enableCodeCoverage YES               CODE_SIGN_IDENTITY=""               CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild test               -project IdentityDesk.xcodeproj               -scheme IdentityDesk               -destination "platform=iOS Simulator,id=$DEST"               -enableCodeCoverage YES               CODE_SIGN_IDENTITY=""               CODE_SIGNING_REQUIRED=NO
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
